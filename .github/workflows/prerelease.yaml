name: Build Paper 1.20.1
on:
  push:
    branches: ['1_20_1']
  pull_request:
    branches: ['1_20_1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Clean build and compile acceptance harness
        run: bash gradlew clean build acceptanceJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PolarPaper-1.20.1-Java25
          path: dist/*.jar
          if-no-files-found: error
