name: Package Paper 1.20.1 release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 2.3.2-1.20.1
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Clean release build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash gradlew clean build --no-daemon "-PreleaseVersion=$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: PolarPaper-1.20.1-Java25
          path: dist/*.jar
          if-no-files-found: error
