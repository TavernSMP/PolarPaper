# Config for polar worlds
default:
  autosaveIntervalTicks: -1 # -1 to disable
  announceAutosave: true
  time: 1000
  saveOnStop: false
  loadOnStartup: true
  spawn: 0.0, 64.0, 0.0, 0.0, 0.0
  difficulty: NORMAL
  async: false
  saveLight: true # Whether chunks are saved with light data. Reduces load time and CPU usage while loading but increases world size
  compression: ZSTD # One of: ZSTD, NONE
  compressionLevel: 7 # ZSTD compression level, higher means smaller file size but longer save times. Max 22, default 7
  worldType: FLAT # One of: NORMAL, FLAT, AMPLIFIED, LARGE_BIOMES
  environment: NORMAL # One of: NORMAL, NETHER, THE_END, CUSTOM
  gamerules: # Custom rules: liquidPhysics, blockPhysics, blockGravity, blockFade
    - doMobSpawning: false
    - doFireTick: false
    - randomTickSpeed: 0
    - mobGriefing: false
    - doVinesSpread: false
    - blockFade: false
    - blockPhysics: true
    - blockGravity: true
    - liquidPhysics: true
worlds:
  #worldOne:
    #...
  #worldTwo:
    #...
